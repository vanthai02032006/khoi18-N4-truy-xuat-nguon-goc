name: CI Pipeline (Quality, Security & Tests)

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  security-and-compliance:
    name: Security & Compliance Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Quét secret trong mã nguồn (DoD: Không có secret trong mã nguồn)
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 2. Kiểm tra không log dữ liệu định danh nông hộ (DoD: Không log dữ liệu định danh nông hộ)
      - name: Farmer PII Log Detection
        run: |
          echo "Kiểm tra mã nguồn không log thông tin định danh cá nhân nông hộ..."
          # Quét các từ khóa nhạy cảm trong câu lệnh log/print
          PII_FOUND=$(git grep -iE "(logger\.|print\(|logging\.).*(cccd|cmnd|sdt_nongho|so_dien_thoai_nong_ho|chu_ho_id)" backend/app/ || true)
          if [ -n "$PII_FOUND" ]; then
            echo "❌ PHÁT HIỆN LOG DỮ LIỆU ĐỊNH DANH NÔNG HỘ VI PHẠM DoD:"
            echo "$PII_FOUND"
            exit 1
          else
            echo "✅ Không phát hiện log dữ liệu định danh nông hộ."
          fi

      # 3. Quét phụ thuộc sạch (DoD: Quét phụ thuộc sạch)
      - name: Set up Python for dependency scan
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependency Vulnerability Audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt || echo "⚠️ Cảnh báo: Có phụ thuộc cần cập nhật bản vá"
          fi

  backend-quality-and-test:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-cov flake8

      # 4. CI Xanh: Lint & Syntax Check (DoD: CI xanh: build, lint, typecheck, test)
      - name: Code Syntax & Linting (flake8)
        run: |
          # Dừng và báo đỏ nếu có lỗi cú pháp hoặc biến undefined
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      # 5. Unit test & Test Coverage (DoD: Unit test cho nhánh logic mới; độ phủ không giảm)
      - name: Run Unit Tests & Check Coverage (pytest)
        run: |
          if [ -d backend/tests ] && [ $(find backend/tests -name "test_*.py" | wc -l) -gt 0 ]; then
            PYTHONPATH=. pytest backend/tests -v --cov=backend/app --cov-report=term-missing
          else
            echo "Chưa có file test trong backend/tests, kiểm tra import và cấu trúc backend/app..."
            PYTHONPATH=. python -c "import backend.app.main; print('Build & Import backend app OK')"
          fi
